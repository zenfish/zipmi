[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zipmi"
dynamic = ["version"]          # single-sourced from zipmi.__version__
description = "Scapy-based IPMI library, CLI, and virtual BMC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dan Farmer" }]
keywords = ["ipmi", "bmc", "idrac", "redfish", "scapy", "security", "rmcp", "rakp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.6",
    "cryptography>=45",
]

[project.urls]
Homepage = "https://github.com/zenfish/zipmi"
Repository = "https://github.com/zenfish/zipmi"
Issues = "https://github.com/zenfish/zipmi/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
zipmi  = "zipmi.cli.zipmi:main"
bmc-id = "zipmi.cli.bmc_id:main"

[tool.setuptools.dynamic]
version = { attr = "zipmi.__version__" }

[tool.setuptools.packages.find]
include = ["zipmi*"]

[tool.setuptools.package-data]
zipmi = [
    "data/zmap-ipmi-decode/tuple_map.json",
    "data/zmap-ipmi-decode/kb/*.json",
    "data/sources/*.json",
    "data/sources/*.md",
]

[tool.pytest.ini_options]
markers = [
    "live: requires ZIPMI_LIVE_TARGET env var pointing at a real BMC",
]
