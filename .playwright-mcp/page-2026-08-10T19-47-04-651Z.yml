  - group [ref=f1e56]:
    - heading "Quickstart" [level=2] [ref=f1e58]
    - code [ref=f1e60]: "export ZIPMI_TARGET=192.168.0.23 ZIPMI_USER=root ZIPMI_PASS=calvin # Spec-parity verbs zipmi mc info zipmi -I lanplus -C 3 mc info # IPMI 2.0 RMCP+ zipmi chassis status zipmi sel list zipmi sensor list zipmi user list zipmi raw 0x06 0x01 # Security probes zipmi scan asf-ping zipmi scan auth-caps zipmi scan cipher-zero zipmi fuzz sweep --netfn 0x30 -v # Dell OEM cmd surface, named # Sessionless mode — omit -U/-P (and unset ZIPMI_USER/ZIPMI_PASS) and # every send goes out auth_type=0, session_id=0. The BMC decides what # to answer. zipmi makes no assumption. unset ZIPMI_USER ZIPMI_PASS zipmi -H 192.168.0.23 raw 0x06 0x38 0x01 0x04 # Get Chan Auth Caps zipmi sessionless # list pre-session cmds # In-process target for tests / fuzzing / CI zipmi vbmc serve --vpersona dell_idrac6 --vport 6231 & zipmi -H 127.0.0.1 -p 6231 mc info"
